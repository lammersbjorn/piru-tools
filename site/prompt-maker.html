<!-- Shared Piru backup core: pure logic, no DOM access, so it can be tested on its own. -->
<script id="piru-core">
"use strict";
// Shared Piru backup core (same block in every tool). Pure logic: no DOM access.
var PiruCore = (function () {
  var SUPPORTED_VERSION = 2;
  var HORIZON_MS = 24 * 60 * 60 * 1000; // Piru's session cap (SessionClustering.horizon)
  var MAX_TS = Date.UTC(2100, 0, 1); // later times are refused as edits: surely a typo

  // JSON parser that keeps source offsets, so edits touch only the changed values.
  // Sets `repeatedKeys` on the root when any object repeats a key: Piru never writes one,
  // and the tool and Piru might then read different values.
  function parse(text) {
    var i = 0, n = text.length, repeated = false;
    if (text.charCodeAt(0) === 0xFEFF) i = 1;
    function fail(what) { throw new SyntaxError("JSON " + what + " at " + i); }
    function ws() {
      while (i < n) { var c = text.charCodeAt(i); if (c === 32 || c === 9 || c === 10 || c === 13) i++; else break; }
    }
    function str() {
      var s = i; i++;
      while (i < n) {
        var c = text.charCodeAt(i);
        if (c === 34) { i++; return JSON.parse(text.slice(s, i)); }
        if (c === 92) i += 2; else if (c < 32) fail("control character"); else i++;
      }
      fail("unterminated string");
    }
    var numRe = /-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;
    function value() {
      ws();
      var s = i, c = text[i];
      if (c === "{") {
        i++; var members = []; ws();
        if (text[i] === "}") { i++; return { t: "o", s: s, e: i, m: members }; }
        var seen = new Set();
        for (;;) {
          ws(); if (text[i] !== '"') fail("expected key");
          var ks = i, key = str(); ws();
          if (seen.has(key)) repeated = true; else seen.add(key);
          if (text[i] !== ":") fail("expected colon"); i++;
          var v = value(); members.push({ k: key, ks: ks, v: v }); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "}") { i++; break; }
          fail("expected , or }");
        }
        return { t: "o", s: s, e: i, m: members };
      }
      if (c === "[") {
        i++; var items = []; ws();
        if (text[i] === "]") { i++; return { t: "a", s: s, e: i, items: items }; }
        for (;;) {
          items.push(value()); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "]") { i++; break; }
          fail("expected , or ]");
        }
        return { t: "a", s: s, e: i, items: items };
      }
      if (c === '"') { var sv = str(); return { t: "s", s: s, e: i, v: sv }; }
      if (text.startsWith("true", i)) { i += 4; return { t: "b", s: s, e: i, v: true }; }
      if (text.startsWith("false", i)) { i += 5; return { t: "b", s: s, e: i, v: false }; }
      if (text.startsWith("null", i)) { i += 4; return { t: "z", s: s, e: i, v: null }; }
      numRe.lastIndex = i;
      var m = numRe.exec(text);
      if (m && m[0].length) { i += m[0].length; return { t: "n", s: s, e: i, v: Number(m[0]) }; }
      fail("unexpected character");
    }
    var root = value(); ws();
    if (i !== n) fail("trailing data");
    root.repeatedKeys = repeated;
    return root;
  }

  function member(obj, key) {
    if (!obj || obj.t !== "o") return null;
    for (var j = obj.m.length - 1; j >= 0; j--) if (obj.m[j].k === key) return obj.m[j];
    return null;
  }
  function get(obj, key) { var mm = member(obj, key); return mm ? mm.v : null; }
  function getStr(obj, key) { var v = get(obj, key); return v && v.t === "s" ? v.v : null; }
  function getNum(obj, key) { var v = get(obj, key); return v && v.t === "n" ? v.v : null; }
  function getBool(obj, key) { var v = get(obj, key); return !!(v && v.t === "b" && v.v); }
  function arr(obj, key) { var v = get(obj, key); return v && v.t === "a" ? v.items.filter(function (x) { return x.t === "o"; }) : []; }
  function firstArr(obj, keys) { for (var j = 0; j < keys.length; j++) { var v = get(obj, keys[j]); if (v && v.t === "a") return arr(obj, keys[j]); } return []; }
  function present(obj, key) { var v = get(obj, key); return !!(v && v.t !== "z"); }

  function fold(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  // Reads a file's bytes and decides whether it is a plain Piru backup.
  function analyze(bytes, fileName, opts) {
    opts = opts || {};
    var name = String(fileName || "");
    if (/\.piruenc$/i.test(name)) return { ok: false, error: "encrypted" };
    if (!bytes || bytes.length === 0) return { ok: false, error: "empty" };
    var text;
    try { text = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(bytes); }
    catch (e) { return { ok: false, error: "notjson" }; }
    var root;
    try { root = parse(text); } catch (e) { return { ok: false, error: "notjson" }; }
    if (root.t !== "o") return { ok: false, error: "notpiru" };
    if (member(root, "sealed") && member(root, "kind")) return { ok: false, error: "encrypted" };
    var ver = get(root, "piruExportVersion");
    if (!ver) {
      if (member(root, "experiences")) return { ok: false, error: "psylog" };
      if (member(root, "doseEntries")) return { ok: false, error: "legacy" };
      return { ok: false, error: "notpiru" };
    }
    if (ver.t !== "n" || !Number.isInteger(ver.v)) return { ok: false, error: "notpiru" };
    if (root.repeatedKeys) return { ok: false, error: "repeated" };
    // Piru refuses to import a newer format (DataExportImport.classify), and a newer format
    // may mean fields this page would misread, so only the read-only inspector opens one.
    if (ver.v > SUPPORTED_VERSION && !opts.allowNewer) return { ok: false, error: "newer", version: ver.v };
    var sv = get(root, "sessions"), ov = get(root, "orphanDoses");
    if ((sv && sv.t !== "a" && sv.t !== "z") || (ov && ov.t !== "a" && ov.t !== "z")) return { ok: false, error: "notpiru" };
    var model = buildModel(text, root);
    model.version = ver.v;
    model.newer = ver.v > SUPPORTED_VERSION;
    if (model.doses.length === 0 && !opts.allowEmpty) return { ok: false, error: "noentries", model: model };
    return { ok: true, model: model };
  }

  function buildModel(text, root) {
    var doses = [], sessions = [];
    function addDose(node, arrNode, pos, sessionIdx) {
      var sub = getStr(node, "substance");
      if (sub === null) return;
      doses.push({
        i: doses.length, node: node, arr: arrNode, pos: pos, session: sessionIdx,
        sub: sub, ts: getNum(node, "timestamp"), amount: getNum(node, "amount"),
        unit: getStr(node, "unit") || "", route: getStr(node, "route") || "",
        id: getStr(node, "id"), uid: getStr(node, "substanceUID"),
        notes: getStr(node, "notes"), unknown: getBool(node, "isUnknownDose")
      });
    }
    function walk(arrNode, sessionIdx) {
      if (!arrNode || arrNode.t !== "a") return [];
      var start = doses.length;
      arrNode.items.forEach(function (it, pos) { if (it.t === "o") addDose(it, arrNode, pos, sessionIdx); });
      var out = []; for (var k = start; k < doses.length; k++) out.push(k);
      return out;
    }
    var sessArr = get(root, "sessions");
    if (sessArr && sessArr.t === "a") {
      sessArr.items.forEach(function (s, pos) {
        if (s.t !== "o") return;
        var idx = sessions.length;
        var notesV = get(s, "notes");
        var sess = {
          i: idx, node: s, pos: pos, id: getStr(s, "id"), start: getNum(s, "startDate"),
          title: getStr(s, "title"), note: getStr(s, "note"),
          notesCount: notesV && notesV.t === "a" ? notesV.items.length : 0,
          dosesArr: get(s, "doses"), doses: []
        };
        sessions.push(sess);
        sess.doses = walk(sess.dosesArr, idx);
      });
    }
    var orphanArr = get(root, "orphanDoses");
    var orphans = walk(orphanArr, -1);

    var records = {
      favorites: arr(root, "favorites"),
      quickLog: arr(root, "quickLogDoses"),
      units: firstArr(root, ["customUnits", "customUnitPresets"]),
      drinks: firstArr(root, ["drinkPresets", "customDrinkPresets"]),
      daily: arr(root, "dailyDoseItems"),
      occurrences: arr(root, "routineOccurrences"),
      inventory: arr(root, "inventory"),
      colors: arr(root, "substanceColors")
    };
    var customs = arr(root, "customSubstances").map(function (c) {
      return { node: c, name: getStr(c, "name"), displayName: getStr(c, "displayName") };
    }).filter(function (c) { return c.name; });

    var counts = new Map();
    doses.forEach(function (d) { counts.set(d.sub, (counts.get(d.sub) || 0) + 1); });
    var customNames = new Set(customs.map(function (c) { return c.name; }));
    var substances = Array.from(counts, function (e) {
      var c = customs.find(function (x) { return x.name === e[0]; });
      return { name: e[0], count: e[1], custom: customNames.has(e[0]), label: c && c.displayName && c.displayName !== e[0] ? c.displayName : null };
    }).sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });

    return {
      text: text, root: root, doses: doses, sessions: sessions, orphans: orphans, orphanArr: orphanArr && orphanArr.t === "a" ? orphanArr : null,
      records: records, customs: customs, customNames: customNames, substances: substances,
      bom: text.charCodeAt(0) === 0xFEFF, eol: /\r\n/.test(text.slice(0, 4096)) ? "\r\n" : "\n",
      appVersion: getStr(root, "appVersion"), exportedAt: getNum(root, "exportedAt")
    };
  }

  // Piru's import dedupe key (DataExportImport.doseDedupKey): lowercased substance and unit,
  // millisecond time, amount and route. Rows with the same key are imported once.
  function amountKey(a) { return a === 0 && 1 / a < 0 ? "-0" : String(a); }
  // The time as Piru's key reads it: Date(ms:) then msSince1970, which truncates. Equal to
  // the stored value for every realistic date; differs only within seconds of 1970.
  function piruMs(ts) { return typeof ts === "number" ? Math.trunc((((ts / 1000) - 978307200) + 978307200) * 1000) : ts; }
  function dedupKey(d, override) {
    var o = override || {};
    var sub = o.sub != null ? o.sub : d.sub, ts = o.ts != null ? o.ts : d.ts;
    var amount = o.amount != null ? o.amount : d.amount, unit = o.unit != null ? o.unit : d.unit;
    return sub.toLowerCase() + "|" + piruMs(ts) + "|" + amountKey(amount) + "|" + unit.toLowerCase() + "|" + d.route;
  }

  // ---- Duplicate groups ----
  var NEAR_MS = 60 * 1000;
  // Near duplicates treat the two micro signs (µ U+00B5, μ U+03BC) as the same unit,
  // as Piru's DoseQuantity does; Piru's import dedupe does not.
  function nearKey(d) {
    var a = d.amount === 0 && 1 / d.amount < 0 ? "-0" : String(d.amount);
    return d.sub.toLowerCase() + "|" + a + "|" + d.unit.toLowerCase().replace(/μ/g, "µ") + "|" + d.route;
  }

  // Exact groups use Piru's own import key; members stay in file order, so "first" is the
  // copy Piru itself would keep.
  function findDuplicates(model) {
    var byKey = new Map();
    model.doses.forEach(function (d) {
      if (typeof d.ts !== "number" || typeof d.amount !== "number") return;
      var k = dedupKey(d);
      if (!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(d.i);
    });
    var exact = [];
    byKey.forEach(function (list) { if (list.length > 1) exact.push({ kind: "exact", members: list }); });
    exact.sort(function (a, b) { return a.members[0] - b.members[0]; });

    // Near: one representative per exact key, chained within a minute of the group's first.
    var reps = [];
    byKey.forEach(function (list) { reps.push(model.doses[list[0]]); });
    reps.sort(function (a, b) { var x = nearKey(a), y = nearKey(b); return x < y ? -1 : x > y ? 1 : a.ts - b.ts || a.i - b.i; });
    var near = [], cur = null;
    reps.forEach(function (d) {
      if (cur && cur.key === nearKey(d) && d.ts - cur.start <= NEAR_MS) { cur.members.push(d.i); return; }
      if (cur && cur.members.length > 1) near.push({ kind: "near", members: cur.members });
      cur = { key: nearKey(d), start: d.ts, members: [d.i] };
    });
    if (cur && cur.members.length > 1) near.push({ kind: "near", members: cur.members });
    near.forEach(function (g) { g.members.sort(function (a, b) { return a - b; }); });
    near.sort(function (a, b) { return a.members[0] - b.members[0]; });
    var empty = model.sessions.filter(function (s) { return s.doses.length === 0; }).map(function (s) { return s.i; });
    return { exact: exact, near: near, alreadyEmpty: empty };
  }

  // ---- Byte-preserving edits ----
  function applyEdits(text, edits, from, to) {
    var s0 = from || 0, e0 = to == null ? text.length : to;
    edits = edits.filter(function (ed) { return ed.s >= s0 && ed.e <= e0; });
    edits.sort(function (a, b) { return a.s - b.s || a.e - b.e; });
    var out = [], cur = s0;
    edits.forEach(function (ed) {
      if (ed.s < cur) throw new Error("Overlapping edits");
      out.push(text.slice(cur, ed.s), ed.text); cur = ed.e;
    });
    out.push(text.slice(cur, e0));
    return out.join("");
  }

  // Replaces one value in place; keeps the key, spacing and everything around it.
  function setValueEdit(obj, key, valueText, edits) {
    var mm = member(obj, key);
    if (mm) edits.push({ s: mm.v.s, e: mm.v.e, text: valueText });
    return !!mm;
  }

  // Removes keys from an object together with exactly one separating comma.
  function removeKeysEdits(obj, keys, edits) {
    var removeSet = new Set(keys.filter(function (k) { return member(obj, k); }));
    if (!removeSet.size) return;
    var m = obj.m, idx = 0;
    while (idx < m.length) {
      if (!removeSet.has(m[idx].k)) { idx++; continue; }
      var a = idx; while (idx < m.length && removeSet.has(m[idx].k)) idx++;
      var b = idx - 1;
      if (idx < m.length) edits.push({ s: m[a].ks, e: m[idx].ks, text: "" });
      else if (a > 0) edits.push({ s: m[a - 1].v.e, e: m[b].v.e, text: "" });
      else edits.push({ s: m[a].ks, e: m[b].v.e, text: "" });
    }
  }

  // An emptied array in Apple's pretty-printed shape: "[" EOL EOL indent "]".
  function emptyArrayInner(text, arrNode) {
    var inner = text.slice(arrNode.s + 1, arrNode.e - 1);
    if (!/[\r\n]/.test(inner)) return "";
    var eol = /\r\n/.test(inner) ? "\r\n" : "\n";
    var lastNl = inner.lastIndexOf("\n");
    var indent = inner.slice(lastNl + 1);
    if (!/^[ \t]*$/.test(indent)) indent = "";
    return eol + eol + indent;
  }

  // Removes the listed item positions from an array, with their separators only.
  function removeItemsEdits(text, arrNode, positions, edits) {
    var set = new Set(positions), items = arrNode.items;
    if (!set.size) return;
    if (set.size >= items.length && items.every(function (_, k) { return set.has(k); })) {
      edits.push({ s: arrNode.s + 1, e: arrNode.e - 1, text: emptyArrayInner(text, arrNode) });
      return;
    }
    var idx = 0;
    while (idx < items.length) {
      if (!set.has(idx)) { idx++; continue; }
      var a = idx; while (idx < items.length && set.has(idx)) idx++;

<script id="prompt-logic">
"use strict";
// Contribution prompts (same block on index.html and prompt-maker.html). Pure logic: no DOM access.
// The prompt is plain text. User text is cleaned here and only ever shown as text, never as HTML.
var PiruPrompt = (function () {
  var PIRU_REPO = "https://github.com/kageroumado/piru";
  var TOOLS_REPO = "https://github.com/lammersbjorn/piru-tools";
  var TOOLS_SITE = "https://lammersbjorn.github.io/piru-tools/";
  var MAX_TEXT = 2000;
  var TOOLS = [
    { id: "inspector", name: "Inspect a backup", page: "inspector.html", what: "show what the journal contains and flag possible problems, without changing anything" },
    { id: "move-substance", name: "Move entries to another substance", page: "move-substance.html", what: "move doses that were logged under the wrong substance to the right one" },
    { id: "duplicates", name: "Remove duplicates", page: "duplicates.html", what: "find entries logged twice and keep one of each" },
    { id: "unit-fixer", name: "Fix units", page: "unit-fixer.html", what: "convert entries between units, or fix an amount logged in the wrong unit" },
    { id: "time-shift", name: "Shift entries in time", page: "time-shift.html", what: "move entries by hours and minutes, or to another date, for example after a wrong clock or time zone" },
    { id: "split-out", name: "Split out entries", page: "split-out.html", what: "move chosen entries, such as a friend's, out of the journal into a separate backup" }
  ];
  var RULES = "README, any CONTRIBUTING, AGENTS.md or CLAUDE.md";
  // Only small wording changes per assistant; no claims about features an assistant may lack.
  var AGENTS = {
    claude: { rules: RULES, run: "Run the build and the tests yourself in the terminal and show me the results.", runTests: "Run the tests yourself in the terminal and show me the results." },
    codex: { rules: RULES, run: "Run the build and the tests yourself and show me the results. If you can't run them where you are, for example without Xcode or network access, tell me the exact commands to run instead.", runTests: "Run the tests yourself and show me the results. If you can't run them where you are, tell me the exact commands to run instead." },
    cursor: { rules: "README, any CONTRIBUTING, AGENTS.md, CLAUDE.md or Cursor rules (.cursor/rules)", run: "Run the build and the tests in the terminal and show me the results.", runTests: "Run the tests in the terminal and show me the results." },
    other: { rules: RULES, run: "Run the build and the tests yourself if you can; otherwise tell me the exact commands to run.", runTests: "Run the tests yourself if you can; otherwise tell me the exact commands to run." }
  };
  var PLATFORM = {
    ios: "Platform: iOS only. Leave any other platform's code untouched.",
    both: "Platforms: iOS and Android. First check whether the Piru repository contains an Android app. If it does, build the feature on both, with the same behaviour, following each platform's own patterns. If it doesn't, build it for iOS only and say so in the pull request."
  };

  function tool(id) { for (var j = 0; j < TOOLS.length; j++) if (TOOLS[j].id === id) return TOOLS[j]; return null; }

  // Free text as plain prompt text: no control or direction-override characters, no runs of
  // blank lines, at most MAX_TEXT characters.
  function clean(s) {
    s = String(s == null ? "" : s).replace(/\r\n?/g, "\n").replace(/\t/g, "  ");
    s = s.replace(/[\u0000-\u0009\u000B-\u001F\u007F-\u009F؜‎‏‪-‮⁦-⁩]/g, "");
    s = s.replace(/[  ]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim();
    var chars = Array.from(s);
    if (chars.length > MAX_TEXT) s = chars.slice(0, MAX_TEXT).join("").trim() + " …";
    return s;
  }
  // Continuation lines are indented so multi-line text stays inside its field.
  function indent(s) { return s.split("\n").map(function (l, k) { return k && l ? "  " + l : l; }).join("\n"); }

  function workWithMe(o, piru) {
    var a = AGENTS[o.agent] || AGENTS.other;
    var L = ["", "How to work with me:",
      "- Before writing code, show me your plan and wait for my go-ahead.",
      "- " + (piru ? a.run : a.runTests)];
    if (o.selfTest) L.push(piru
      ? "- I will test it on my own copy of Piru with synthetic data before the pull request is opened. When the feature works, stop, give me short steps to install your build and test it, and wait for my go-ahead."
      : "- I will test the page on my own copy with made-up backups before the pull request is opened. When it works, stop, tell me how to open it locally, and wait for my go-ahead.");
    L.push("- Show me the pull request title and description before you open it. Open it from my fork with the GitHub CLI (gh pr create) if it is installed and signed in; otherwise tell me how to open it on github.com.");
    return L;
  }

  // o: { kind: "tool" | "piru" | "site", tool, text, agent, platform: "ios" | "both", details, selfTest }
  function piruPrompt(o) {
    var t = o.kind === "tool" ? tool(o.tool) : null, isTool = o.kind === "tool";
    var a = AGENTS[o.agent] || AGENTS.other;
    var feature = isTool
      ? (t ? t.name + ": " + t.what + ". Matching page: " + t.page + "."
           : "[Name one tool from " + TOOLS_SITE + " here, for example “Remove duplicates”.]")
      : (clean(o.text) ? indent(clean(o.text)) : "[Describe the feature here.]");
    var details = clean(o.details);
    var L = [
      "You are contributing a feature to Piru, an open-source substance journal app (" + PIRU_REPO + "). Your goal is one small, high-quality pull request that the maintainer would be happy to merge.",
      "",
      "Feature to build: " + feature
    ];
    if (details) L.push("", "Details from me: " + indent(details));
    L.push("");
    if (isTool) L.push("Reference implementation: " + TOOLS_REPO + " (MIT licensed, offline web tools that do this on exported Piru backups). Read the matching HTML page to understand the exact behaviour, edge cases and safety rules. Reimplement it natively inside Piru on Piru's own data model; do not embed the web page.");
    else L.push("Reference implementation: there is none. Work out the exact behaviour, edge cases and safety rules from the description above and from how Piru already works, and include them in your plan before writing code.");
    L.push("",
      "Before writing code:",
      "1. Fork and clone Piru. Read its " + a.rules + ", and follow them exactly.",
      "2. Find how Piru stores doses, sessions, custom substances, medications and stock, and how its import, export and duplicate detection work (look for DataExportImport and the model types). Match its naming, architecture, localisation and UI patterns.",
      "3. Check open issues and pull requests so you don't duplicate work, and keep the change limited to this one feature.",
      "",
      "Requirements:",
      "- Data safety first: show a clear preview of exactly what will change; ask for confirmation; offer Undo or make a recovery backup before any destructive change; never touch records the user didn't select.",
      "- Reuse Piru's existing views, components and strings style. No new dependencies.",
      "- Localise all new strings the way Piru does.",
      "- Accessible: VoiceOver labels, Dynamic Type at the largest sizes, sufficient contrast.",
      "- " + (PLATFORM[o.platform] || PLATFORM.ios),
      "",
      "Verify before opening the PR:",
      "- Add unit tests for the core logic, covering " + (isTool ? "edge cases" : "the edge cases that apply") + " (micro sign µ vs Greek μ, time zones and daylight saving, empty sessions, custom substances, large journals).",
      "- Build the app and run the full existing test suite; everything must pass.",
      "- Run the feature in the simulator on synthetic data only and take before/after screenshots.",
      "",
      "Open the pull request:",
      "- Clear title and a short description of the problem it solves, how it works, how you tested it, and the screenshots.",
      "- State that it was written with AI assistance and that you reviewed and tested it.");
    if (isTool) L.push("- Credit the reference: \"Behaviour based on lammersbjorn/piru-tools (MIT).\"");
    L.push("- Keep it small and focused; one feature per pull request.");
    if (isTool) L.push("",
      "After Piru merges it:",
      "- Open an issue or pull request on " + TOOLS_REPO + " saying which tool Piru now includes (link the merged PR), so it can be removed from the tools site.");
    return L.concat(workWithMe(o, true)).join("\n");
  }

  function sitePrompt(o) {
    var a = AGENTS[o.agent] || AGENTS.other;
    var text = clean(o.text), details = clean(o.details);
    var L = [
      "You are adding a new tool to Piru tools (" + TOOLS_REPO + "), a set of free, offline, single-page web tools that fix or check exported backups of Piru, an open-source substance journal app (" + PIRU_REPO + "). Your goal is one small, high-quality pull request that the maintainer would be happy to merge.",
      "",
      "Tool to build: " + (text ? indent(text) : "[Describe the tool here.]")
    ];
    if (details) L.push("", "Details from me: " + indent(details));
    L.push("",
      "First, a check: if this really belongs inside Piru itself, tell me before you start. A pull request to Piru may serve people better than a web tool.",
      "",
      "Before writing code:",
      "1. Fork and clone lammersbjorn/piru-tools. Read its README, PRIVACY and LICENSE, and any CONTRIBUTING, AGENTS.md" + (o.agent === "cursor" ? ", CLAUDE.md or Cursor rules (.cursor/rules)" : " or CLAUDE.md") + ", and follow them exactly.",
      "2. Study an existing tool page, such as unit-fixer.html, and copy its structure exactly: one standalone HTML file; the same strict Content-Security-Policy with no network access; the same shared CSS and design tokens; the same English and French i18n tables and language switch; the same footer; and the same shared backup parsing and validation, unchanged, which refuses encrypted backups and backup versions above 2.",
      "3. Check open issues and pull requests so you don't duplicate work.",
      "",
      "Requirements:",
      "- Edit byte for byte: only the intended values change. Unknown fields, key order, spacing and line endings stay exactly as they were.",
      "- Data safety first: show a clear preview of exactly what will change, never change the original file, and explain how to import the result into Piru.",
      "- Everything runs on the device: no network requests, no analytics, no external fonts or scripts.",
      "- Translate every new string into English and French.",
      "- Accessible: one h1, labelled controls, status messages in an aria-live region, focus moved to each new step, 44 pt touch targets, reduced motion respected, 4.5:1 text contrast in dark and light mode.",
      "- Add the tool to index.html and to the README.",
      "",
      "Verify before opening the PR:",
      "- Add a small node test that runs the tool's logic on synthetic, made-up backups (never real data). Assert that only the intended bytes change and that the output is still valid Piru JSON. Run the existing tests too, with pnpm test, pnpm check and pnpm test:e2e; everything must pass.",
      "- Check the page in a browser at phone width (390 px) in dark and light mode, in English and French, with no console errors and no network requests.",
      "",
      "Open the pull request on lammersbjorn/piru-tools:",
      "- Clear title and a short description of what the tool does, why it is needed, and how you tested it, with screenshots.",
      "- State that it was written with AI assistance and that you reviewed and tested it.",
      "- Keep it to one tool per pull request.");
    return L.concat(workWithMe(o, false)).join("\n");
  }

  function build(o) { return o.kind === "site" ? sitePrompt(o) : piruPrompt(o); }
  // The quick prompt: a Piru pull request, with the tool left for the person to fill in.
  function quick() { return build({ kind: "tool", tool: null, agent: "other", platform: "ios" }); }

  return { TOOLS: TOOLS, tool: tool, clean: clean, build: build, quick: quick, MAX_TEXT: MAX_TEXT };
})();
if (typeof module !== "undefined") module.exports = PiruPrompt;
</script>
