<!-- Shared Piru backup core: pure logic, no DOM access, so it can be tested on its own. -->
<script id="piru-core">
"use strict";
// Shared Piru backup core (same block in every tool). Pure logic: no DOM access.
var PiruCore = (function () {
  var SUPPORTED_VERSION = 2;
  var HORIZON_MS = 24 * 60 * 60 * 1000; // Piru's session cap (SessionClustering.horizon)
  var MAX_TS = Date.UTC(2100, 0, 1); // later times are refused as edits: surely a typo

  // JSON parser that keeps source offsets, so edits touch only the changed values.
  // Sets `repeatedKeys` on the root when any object repeats a key: Piru never writes one,
  // and the tool and Piru might then read different values.
  function parse(text) {
    var i = 0, n = text.length, repeated = false;
    if (text.charCodeAt(0) === 0xFEFF) i = 1;
    function fail(what) { throw new SyntaxError("JSON " + what + " at " + i); }
    function ws() {
      while (i < n) { var c = text.charCodeAt(i); if (c === 32 || c === 9 || c === 10 || c === 13) i++; else break; }
    }
    function str() {
      var s = i; i++;
      while (i < n) {
        var c = text.charCodeAt(i);
        if (c === 34) { i++; return JSON.parse(text.slice(s, i)); }
        if (c === 92) i += 2; else if (c < 32) fail("control character"); else i++;
      }
      fail("unterminated string");
    }
    var numRe = /-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;
    function value() {
      ws();
      var s = i, c = text[i];
      if (c === "{") {
        i++; var members = []; ws();
        if (text[i] === "}") { i++; return { t: "o", s: s, e: i, m: members }; }
        var seen = new Set();
        for (;;) {
          ws(); if (text[i] !== '"') fail("expected key");
          var ks = i, key = str(); ws();
          if (seen.has(key)) repeated = true; else seen.add(key);
          if (text[i] !== ":") fail("expected colon"); i++;
          var v = value(); members.push({ k: key, ks: ks, v: v }); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "}") { i++; break; }
          fail("expected , or }");
        }
        return { t: "o", s: s, e: i, m: members };
      }
      if (c === "[") {
        i++; var items = []; ws();
        if (text[i] === "]") { i++; return { t: "a", s: s, e: i, items: items }; }
        for (;;) {
          items.push(value()); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "]") { i++; break; }
          fail("expected , or ]");
        }
        return { t: "a", s: s, e: i, items: items };
      }
      if (c === '"') { var sv = str(); return { t: "s", s: s, e: i, v: sv }; }
      if (text.startsWith("true", i)) { i += 4; return { t: "b", s: s, e: i, v: true }; }
      if (text.startsWith("false", i)) { i += 5; return { t: "b", s: s, e: i, v: false }; }
      if (text.startsWith("null", i)) { i += 4; return { t: "z", s: s, e: i, v: null }; }
      numRe.lastIndex = i;
      var m = numRe.exec(text);
      if (m && m[0].length) { i += m[0].length; return { t: "n", s: s, e: i, v: Number(m[0]) }; }
      fail("unexpected character");
    }
    var root = value(); ws();
    if (i !== n) fail("trailing data");
    root.repeatedKeys = repeated;
    return root;
  }

  function member(obj, key) {
    if (!obj || obj.t !== "o") return null;
    for (var j = obj.m.length - 1; j >= 0; j--) if (obj.m[j].k === key) return obj.m[j];
    return null;
  }
  function get(obj, key) { var mm = member(obj, key); return mm ? mm.v : null; }
  function getStr(obj, key) { var v = get(obj, key); return v && v.t === "s" ? v.v : null; }
  function getNum(obj, key) { var v = get(obj, key); return v && v.t === "n" ? v.v : null; }
  function getBool(obj, key) { var v = get(obj, key); return !!(v && v.t === "b" && v.v); }
  function arr(obj, key) { var v = get(obj, key); return v && v.t === "a" ? v.items.filter(function (x) { return x.t === "o"; }) : []; }
  function firstArr(obj, keys) { for (var j = 0; j < keys.length; j++) { var v = get(obj, keys[j]); if (v && v.t === "a") return arr(obj, keys[j]); } return []; }
  function present(obj, key) { var v = get(obj, key); return !!(v && v.t !== "z"); }

  function fold(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  // Reads a file's bytes and decides whether it is a plain Piru backup.
  function analyze(bytes, fileName, opts) {
    opts = opts || {};
    var name = String(fileName || "");
    if (/\.piruenc$/i.test(name)) return { ok: false, error: "encrypted" };
    if (!bytes || bytes.length === 0) return { ok: false, error: "empty" };
    var text;
    try { text = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(bytes); }
    catch (e) { return { ok: false, error: "notjson" }; }
    var root;
    try { root = parse(text); } catch (e) { return { ok: false, error: "notjson" }; }
    if (root.t !== "o") return { ok: false, error: "notpiru" };
    if (member(root, "sealed") && member(root, "kind")) return { ok: false, error: "encrypted" };
    var ver = get(root, "piruExportVersion");
    if (!ver) {
      if (member(root, "experiences")) return { ok: false, error: "psylog" };
      if (member(root, "doseEntries")) return { ok: false, error: "legacy" };
      return { ok: false, error: "notpiru" };
    }
    if (ver.t !== "n" || !Number.isInteger(ver.v)) return { ok: false, error: "notpiru" };
    if (root.repeatedKeys) return { ok: false, error: "repeated" };
    // Piru refuses to import a newer format (DataExportImport.classify), and a newer format
    // may mean fields this page would misread, so only the read-only inspector opens one.
    if (ver.v > SUPPORTED_VERSION && !opts.allowNewer) return { ok: false, error: "newer", version: ver.v };
    var sv = get(root, "sessions"), ov = get(root, "orphanDoses");
    if ((sv && sv.t !== "a" && sv.t !== "z") || (ov && ov.t !== "a" && ov.t !== "z")) return { ok: false, error: "notpiru" };
    var model = buildModel(text, root);
    model.version = ver.v;
    model.newer = ver.v > SUPPORTED_VERSION;
    if (model.doses.length === 0 && !opts.allowEmpty) return { ok: false, error: "noentries", model: model };
    return { ok: true, model: model };
  }

  function buildModel(text, root) {
    var doses = [], sessions = [];
    function addDose(node, arrNode, pos, sessionIdx) {
      var sub = getStr(node, "substance");
      if (sub === null) return;
      doses.push({
        i: doses.length, node: node, arr: arrNode, pos: pos, session: sessionIdx,
        sub: sub, ts: getNum(node, "timestamp"), amount: getNum(node, "amount"),
        unit: getStr(node, "unit") || "", route: getStr(node, "route") || "",
        id: getStr(node, "id"), uid: getStr(node, "substanceUID"),
        notes: getStr(node, "notes"), unknown: getBool(node, "isUnknownDose")
      });
    }
    function walk(arrNode, sessionIdx) {
      if (!arrNode || arrNode.t !== "a") return [];
      var start = doses.length;
      arrNode.items.forEach(function (it, pos) { if (it.t === "o") addDose(it, arrNode, pos, sessionIdx); });
      var out = []; for (var k = start; k < doses.length; k++) out.push(k);
      return out;
    }
    var sessArr = get(root, "sessions");
    if (sessArr && sessArr.t === "a") {
      sessArr.items.forEach(function (s, pos) {
        if (s.t !== "o") return;
        var idx = sessions.length;
        var notesV = get(s, "notes");
        var sess = {
          i: idx, node: s, pos: pos, id: getStr(s, "id"), start: getNum(s, "startDate"),
          title: getStr(s, "title"), note: getStr(s, "note"),
          notesCount: notesV && notesV.t === "a" ? notesV.items.length : 0,
          dosesArr: get(s, "doses"), doses: []
        };
        sessions.push(sess);
        sess.doses = walk(sess.dosesArr, idx);
      });
    }
    var orphanArr = get(root, "orphanDoses");
    var orphans = walk(orphanArr, -1);

    var records = {
      favorites: arr(root, "favorites"),
      quickLog: arr(root, "quickLogDoses"),
      units: firstArr(root, ["customUnits", "customUnitPresets"]),
      drinks: firstArr(root, ["drinkPresets", "customDrinkPresets"]),
      daily: arr(root, "dailyDoseItems"),
      occurrences: arr(root, "routineOccurrences"),
      inventory: arr(root, "inventory"),
      colors: arr(root, "substanceColors")
    };
    var customs = arr(root, "customSubstances").map(function (c) {
      return { node: c, name: getStr(c, "name"), displayName: getStr(c, "displayName") };
    }).filter(function (c) { return c.name; });

    var counts = new Map();
    doses.forEach(function (d) { counts.set(d.sub, (counts.get(d.sub) || 0) + 1); });
    var customNames = new Set(customs.map(function (c) { return c.name; }));
    var substances = Array.from(counts, function (e) {
      var c = customs.find(function (x) { return x.name === e[0]; });
      return { name: e[0], count: e[1], custom: customNames.has(e[0]), label: c && c.displayName && c.displayName !== e[0] ? c.displayName : null };
    }).sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });

    return {
      text: text, root: root, doses: doses, sessions: sessions, orphans: orphans, orphanArr: orphanArr && orphanArr.t === "a" ? orphanArr : null,
      records: records, customs: customs, customNames: customNames, substances: substances,
      bom: text.charCodeAt(0) === 0xFEFF, eol: /\r\n/.test(text.slice(0, 4096)) ? "\r\n" : "\n",
      appVersion: getStr(root, "appVersion"), exportedAt: getNum(root, "exportedAt")
    };
  }

  // Piru's import dedupe key (DataExportImport.doseDedupKey): lowercased substance and unit,
  // millisecond time, amount and route. Rows with the same key are imported once.
  function amountKey(a) { return a === 0 && 1 / a < 0 ? "-0" : String(a); }
  // The time as Piru's key reads it: Date(ms:) then msSince1970, which truncates. Equal to
  // the stored value for every realistic date; differs only within seconds of 1970.
  function piruMs(ts) { return typeof ts === "number" ? Math.trunc((((ts / 1000) - 978307200) + 978307200) * 1000) : ts; }
  function dedupKey(d, override) {
    var o = override || {};
    var sub = o.sub != null ? o.sub : d.sub, ts = o.ts != null ? o.ts : d.ts;
    var amount = o.amount != null ? o.amount : d.amount, unit = o.unit != null ? o.unit : d.unit;
    return sub.toLowerCase() + "|" + piruMs(ts) + "|" + amountKey(amount) + "|" + unit.toLowerCase() + "|" + d.route;
  }

  // ---- Duplicate groups ----
  var NEAR_MS = 60 * 1000;
  // Near duplicates treat the two micro signs (µ U+00B5, μ U+03BC) as the same unit,
  // as Piru's DoseQuantity does; Piru's import dedupe does not.
  function nearKey(d) {
    var a = d.amount === 0 && 1 / d.amount < 0 ? "-0" : String(d.amount);
    return d.sub.toLowerCase() + "|" + a + "|" + d.unit.toLowerCase().replace(/μ/g, "µ") + "|" + d.route;
  }

  // Exact groups use Piru's own import key; members stay in file order, so "first" is the
  // copy Piru itself would keep.
  function findDuplicates(model) {
    var byKey = new Map();
    model.doses.forEach(function (d) {
      if (typeof d.ts !== "number" || typeof d.amount !== "number") return;
      var k = dedupKey(d);
      if (!byKey.has(k)) byKey.set(k, []);
      byKey.get(k).push(d.i);
    });
    var exact = [];
    byKey.forEach(function (list) { if (list.length > 1) exact.push({ kind: "exact", members: list }); });
    exact.sort(function (a, b) { return a.members[0] - b.members[0]; });

    // Near: one representative per exact key, chained within a minute of the group's first.
    var reps = [];
    byKey.forEach(function (list) { reps.push(model.doses[list[0]]); });
    reps.sort(function (a, b) { var x = nearKey(a), y = nearKey(b); return x < y ? -1 : x > y ? 1 : a.ts - b.ts || a.i - b.i; });
    var near = [], cur = null;
    reps.forEach(function (d) {
      if (cur && cur.key === nearKey(d) && d.ts - cur.start <= NEAR_MS) { cur.members.push(d.i); return; }
      if (cur && cur.members.length > 1) near.push({ kind: "near", members: cur.members });
      cur = { key: nearKey(d), start: d.ts, members: [d.i] };
    });
    if (cur && cur.members.length > 1) near.push({ kind: "near", members: cur.members });
    near.forEach(function (g) { g.members.sort(function (a, b) { return a - b; }); });
    near.sort(function (a, b) { return a.members[0] - b.members[0]; });
    var empty = model.sessions.filter(function (s) { return s.doses.length === 0; }).map(function (s) { return s.i; });
    return { exact: exact, near: near, alreadyEmpty: empty };
  }

  // ---- Byte-preserving edits ----
  function applyEdits(text, edits, from, to) {
    var s0 = from || 0, e0 = to == null ? text.length : to;
    edits = edits.filter(function (ed) { return ed.s >= s0 && ed.e <= e0; });
    edits.sort(function (a, b) { return a.s - b.s || a.e - b.e; });
    var out = [], cur = s0;
    edits.forEach(function (ed) {
      if (ed.s < cur) throw new Error("Overlapping edits");
      out.push(text.slice(cur, ed.s), ed.text); cur = ed.e;
    });
    out.push(text.slice(cur, e0));
    return out.join("");
  }

  // Replaces one value in place; keeps the key, spacing and everything around it.
  function setValueEdit(obj, key, valueText, edits) {
    var mm = member(obj, key);
    if (mm) edits.push({ s: mm.v.s, e: mm.v.e, text: valueText });
    return !!mm;
  }

  // Removes keys from an object together with exactly one separating comma.
  function removeKeysEdits(obj, keys, edits) {
    var removeSet = new Set(keys.filter(function (k) { return member(obj, k); }));
    if (!removeSet.size) return;
    var m = obj.m, idx = 0;
    while (idx < m.length) {
      if (!removeSet.has(m[idx].k)) { idx++; continue; }
      var a = idx; while (idx < m.length && removeSet.has(m[idx].k)) idx++;
      var b = idx - 1;
      if (idx < m.length) edits.push({ s: m[a].ks, e: m[idx].ks, text: "" });
      else if (a > 0) edits.push({ s: m[a - 1].v.e, e: m[b].v.e, text: "" });
      else edits.push({ s: m[a].ks, e: m[b].v.e, text: "" });
    }
  }

  // An emptied array in Apple's pretty-printed shape: "[" EOL EOL indent "]".
  function emptyArrayInner(text, arrNode) {
    var inner = text.slice(arrNode.s + 1, arrNode.e - 1);
    if (!/[\r\n]/.test(inner)) return "";
    var eol = /\r\n/.test(inner) ? "\r\n" : "\n";
    var lastNl = inner.lastIndexOf("\n");
    var indent = inner.slice(lastNl + 1);
    if (!/^[ \t]*$/.test(indent)) indent = "";
    return eol + eol + indent;
  }

  // Removes the listed item positions from an array, with their separators only.
  function removeItemsEdits(text, arrNode, positions, edits) {
    var set = new Set(positions), items = arrNode.items;
    if (!set.size) return;
    if (set.size >= items.length && items.every(function (_, k) { return set.has(k); })) {
      edits.push({ s: arrNode.s + 1, e: arrNode.e - 1, text: emptyArrayInner(text, arrNode) });
      return;
    }
    var idx = 0;
    while (idx < items.length) {
      if (!set.has(idx)) { idx++; continue; }
      var a = idx; while (idx < items.length && set.has(idx)) idx++;
      var b = idx - 1;
      if (idx < items.length) edits.push({ s: items[a].s, e: items[idx].s, text: "" });
      else edits.push({ s: items[a - 1].e, e: items[b].e, text: "" });
    }
  }

  // Removes doses (by model index) from their arrays. Sessions left with no doses are removed
  // too when dropEmpty is set, as Piru does when a session's last entry moves away.
  function removeDosesEdits(model, doseIdxs, dropEmpty, edits, extraSessions) {
    var byArr = new Map(), removeSet = new Set(doseIdxs), emptied = [];
    doseIdxs.forEach(function (k) {
      var d = model.doses[k];
      if (!byArr.has(d.arr)) byArr.set(d.arr, []);
      byArr.get(d.arr).push(d.pos);
    });
    var dropSessions = [];
    model.sessions.forEach(function (s) {
      if (!s.doses.length || !s.doses.every(function (k) { return removeSet.has(k); })) return;
      emptied.push(s.i);
      if (dropEmpty) { dropSessions.push(s.pos); byArr.delete(s.dosesArr); }
    });
    byArr.forEach(function (positions, arrNode) { removeItemsEdits(model.text, arrNode, positions, edits); });
    (extraSessions || []).forEach(function (i) { if (dropSessions.indexOf(model.sessions[i].pos) < 0) dropSessions.push(model.sessions[i].pos); });
    if (dropSessions.length) removeItemsEdits(model.text, get(model.root, "sessions"), dropSessions, edits);
    return emptied;
  }

  // Numbers as Piru writes them (Swift's shortest round-trip form); converted values drop
  // binary noise such as 0.30000000000000004.
  function formatNumber(x) {
    if (!isFinite(x)) throw new Error("Not a finite number");
    if (Number.isInteger(x) && Math.abs(x) < 1e21) return String(x);
    return String(Number(x.toPrecision(15)));
  }
  function clean(x) { return Number(formatNumber(x)); }

  // ---- Units (Shared/DoseQuantity.swift: bare spellings only) ----
  var MASS = { "µg": 0.001, "μg": 0.001, "mcg": 0.001, "ug": 0.001, "microgram": 0.001, "micrograms": 0.001, "mcgs": 0.001, "ugs": 0.001,
    "mg": 1, "mgs": 1, "milligram": 1, "milligrams": 1, "g": 1000, "gs": 1000, "gram": 1000, "grams": 1000, "gm": 1000 };
  var VOLUME = { "ml": 1, "milliliter": 1, "milliliters": 1, "cc": 1 };
  function unitInfo(unit) {
    var k = String(unit || "").trim().toLowerCase();
    if (Object.prototype.hasOwnProperty.call(MASS, k)) return { family: "mass", mg: MASS[k] };
    if (Object.prototype.hasOwnProperty.call(VOLUME, k)) return { family: "volume", mg: VOLUME[k] };
    return null;
  }
  // Converts an amount between two units of one family, or returns null.
  function convert(amount, from, to) {
    var a = unitInfo(from), b = unitInfo(to);
