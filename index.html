<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Piru : changer la substance d'entrées / move entries to another substance</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --card: #ffffff; --text: #1b1b1d; --muted: #5d5d66; --line: #d9d9de;
    --accent: #2f5bd3; --accent-text: #ffffff; --warn-bg: #fff4d6; --warn-line: #e0b440; --warn-text: #4d3800;
    --err-bg: #fde8e8; --err-line: #d65050; --err-text: #6b1111; --ok-bg: #e5f4ea; --ok-line: #4a9d68; --ok-text: #11401f;
    --focus: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214; --card: #1d1d21; --text: #f1f1f3; --muted: #a8a8b3; --line: #34343b;
      --accent: #7f9cff; --accent-text: #0b0b10; --warn-bg: #3a2f10; --warn-line: #b38b2a; --warn-text: #ffe7a8;
      --err-bg: #3d1717; --err-line: #c25454; --err-text: #ffd1d1; --ok-bg: #12301d; --ok-line: #3f8c5a; --ok-text: #c9f0d6;
      --focus: #9fb4ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 8px 0 6px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin: 14px 0; }
  .lang { display: flex; gap: 8px; justify-content: flex-end; }
  .lang button {
    min-height: 44px; min-width: 96px; padding: 8px 14px; border-radius: 22px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: inherit; font-size: 0.95rem; cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .privacy { display: flex; gap: 10px; align-items: flex-start; font-size: 0.95rem; }
  .privacy .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--ok-line); margin-top: 8px; }
  ol.steps { padding-left: 1.4em; margin: 0 0 10px; }
  ol.steps li { margin-bottom: 8px; }
  details > summary { cursor: pointer; min-height: 44px; padding: 10px 0; font-weight: 600; }
  label.field { display: block; font-weight: 600; margin: 14px 0 6px; }
  select, input[type="text"] {
    width: 100%; min-height: 52px; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; padding: 12px 18px;
    border-radius: 12px; border: 0; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
    cursor: pointer; text-align: center;
  }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  .file-input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .file-input:focus-visible + label.btn { outline: 3px solid var(--focus); outline-offset: 2px; }
  .check { display: flex; gap: 12px; align-items: flex-start; min-height: 48px; padding: 10px 0; cursor: pointer; }
  .check input { width: 24px; height: 24px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
  .msg { border-radius: 10px; padding: 12px 14px; margin: 12px 0 0; border: 1px solid; }
  .msg.err { background: var(--err-bg); border-color: var(--err-line); color: var(--err-text); }
  .msg.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
  .msg.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-text); }
  .big { font-size: 1.15rem; font-weight: 600; }
  ul.examples { margin: 6px 0 10px; padding-left: 1.2em; }
  .hidden { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }
  footer { font-size: 0.85rem; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div class="lang" role="group" aria-label="Langue / Language">
    <button type="button" id="lang-fr" lang="fr" aria-pressed="true">Français</button>
    <button type="button" id="lang-en" lang="en" aria-pressed="false">English</button>
  </div>

  <h1 data-i18n="title"></h1>
  <p class="muted" data-i18n="subtitle"></p>

  <noscript>
    <div class="msg err">
      <p lang="fr">Cette page a besoin de JavaScript pour fonctionner. Sur iPhone, l'aperçu de l'app Fichiers ou de Mail ne l'exécute pas : ouvrez la page dans Safari, ou utilisez un ordinateur.</p>
      <p lang="en">This page needs JavaScript. On iPhone, the Files or Mail preview does not run it: open the page in Safari, or use a computer.</p>
    </div>
  </noscript>

  <div class="card privacy"><span class="dot" aria-hidden="true"></span><p data-i18n="privacy"></p></div>

  <section class="card" aria-labelledby="how-title">
    <details id="how" open>
      <summary id="how-title" data-i18n="howTitle"></summary>
      <ol class="steps" data-i18n-html="steps"></ol>
      <p data-i18n-html="whyDelete"></p>
      <div class="msg warn" data-i18n-html="deleteNote"></div>
      <p style="margin-top:12px" data-i18n-html="altNote"></p>
    </details>
  </section>

  <section class="card" aria-labelledby="s1">
    <h2 id="s1" data-i18n="s1"></h2>
    <input type="file" id="file" class="file-input">
    <label for="file" class="btn" data-i18n="openBtn"></label>
    <div id="load-status" role="status" aria-live="polite"></div>
  </section>

  <section class="card hidden" id="choose" aria-labelledby="s2">
    <h2 id="s2" data-i18n="s2"></h2>
    <label class="field" for="from" data-i18n="fromLabel"></label>
    <select id="from"></select>
    <label class="field" for="to" data-i18n="toLabel"></label>
    <select id="to"></select>
    <div id="typed-wrap" class="hidden">
      <label class="field" for="typed" data-i18n="typedLabel"></label>
      <input type="text" id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="typed-status">
      <div id="typed-status" aria-live="polite"></div>
    </div>
    <details id="more" style="margin-top:14px">
      <summary data-i18n="moreTitle"></summary>
      <p class="muted" data-i18n="moreIntro"></p>
      <div id="opts"></div>
      <p class="muted" data-i18n="moreNote"></p>
    </details>
  </section>

  <section class="card hidden" id="preview-card" aria-labelledby="s3">
    <h2 id="s3" data-i18n="s3"></h2>
    <div id="preview" aria-live="polite"></div>
  </section>

  <section class="card hidden" id="download-card" aria-labelledby="s4">
    <h2 id="s4" data-i18n="s4"></h2>
    <button type="button" class="btn" id="download" data-i18n="downloadBtn"></button>
    <div id="download-status" role="status" aria-live="polite"></div>
  </section>

  <footer class="muted" data-i18n="footer"></footer>
</main>

<!-- Pure logic: no DOM access, so it can be tested on its own. -->
<script id="piru-logic">
"use strict";
var PiruFix = (function () {
  var SUPPORTED_VERSION = 2;
  var DOSE_FACETS = ["isomer", "releaseForm", "productName", "saltForm", "material"];

  // JSON parser that keeps source offsets, so edits touch only the changed values.
  function parse(text) {
    var i = 0, n = text.length;
    if (text.charCodeAt(0) === 0xFEFF) i = 1;
    function fail(what) { throw new SyntaxError("JSON " + what + " at " + i); }
    function ws() {
      while (i < n) { var c = text.charCodeAt(i); if (c === 32 || c === 9 || c === 10 || c === 13) i++; else break; }
    }
    function str() {
      var s = i; i++;
      while (i < n) {
        var c = text.charCodeAt(i);
        if (c === 34) { i++; return JSON.parse(text.slice(s, i)); }
        if (c === 92) i += 2; else if (c < 32) fail("control character"); else i++;
      }
      fail("unterminated string");
    }
    var numRe = /-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/y;
    function value() {
      ws();
      var s = i, c = text[i];
      if (c === "{") {
        i++; var members = []; ws();
        if (text[i] === "}") { i++; return { t: "o", s: s, e: i, m: members }; }
        for (;;) {
          ws(); if (text[i] !== '"') fail("expected key");
          var ks = i, key = str(); ws();
          if (text[i] !== ":") fail("expected colon"); i++;
          var v = value(); members.push({ k: key, ks: ks, v: v }); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "}") { i++; break; }
          fail("expected , or }");
        }
        return { t: "o", s: s, e: i, m: members };
      }
      if (c === "[") {
        i++; var items = []; ws();
        if (text[i] === "]") { i++; return { t: "a", s: s, e: i, items: items }; }
        for (;;) {
          items.push(value()); ws();
          if (text[i] === ",") { i++; continue; }
          if (text[i] === "]") { i++; break; }
          fail("expected , or ]");
        }
        return { t: "a", s: s, e: i, items: items };
      }
      if (c === '"') { var sv = str(); return { t: "s", s: s, e: i, v: sv }; }
      if (text.startsWith("true", i)) { i += 4; return { t: "b", s: s, e: i, v: true }; }
      if (text.startsWith("false", i)) { i += 5; return { t: "b", s: s, e: i, v: false }; }
      if (text.startsWith("null", i)) { i += 4; return { t: "z", s: s, e: i, v: null }; }
      numRe.lastIndex = i;
      var m = numRe.exec(text);
      if (m && m[0].length) { i += m[0].length; return { t: "n", s: s, e: i, v: Number(m[0]) }; }
      fail("unexpected character");
    }
    var root = value(); ws();
    if (i !== n) fail("trailing data");
    return root;
  }

  function member(obj, key) {
    if (!obj || obj.t !== "o") return null;
    for (var j = obj.m.length - 1; j >= 0; j--) if (obj.m[j].k === key) return obj.m[j];
    return null;
  }
  function get(obj, key) { var mm = member(obj, key); return mm ? mm.v : null; }
  function getStr(obj, key) { var v = get(obj, key); return v && v.t === "s" ? v.v : null; }
  function getNum(obj, key) { var v = get(obj, key); return v && v.t === "n" ? v.v : null; }
  function arr(obj, key) { var v = get(obj, key); return v && v.t === "a" ? v.items.filter(function (x) { return x.t === "o"; }) : []; }
  function firstArr(obj, keys) { for (var j = 0; j < keys.length; j++) { var v = get(obj, keys[j]); if (v && v.t === "a") return arr(obj, keys[j]); } return []; }

  function fold(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  // Reads a file's bytes and decides whether it is a plain Piru backup.
  function analyze(bytes, fileName) {
    var name = String(fileName || "");
    if (/\.piruenc$/i.test(name)) return { ok: false, error: "encrypted" };
    if (!bytes || bytes.length === 0) return { ok: false, error: "empty" };
    var text;
    try { text = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(bytes); }
    catch (e) { return { ok: false, error: "notjson" }; }
    var root;
    try { root = parse(text); } catch (e) { return { ok: false, error: "notjson" }; }
    if (root.t !== "o") return { ok: false, error: "notpiru" };
    if (member(root, "sealed") && member(root, "kind")) return { ok: false, error: "encrypted" };
    var ver = get(root, "piruExportVersion");
    if (!ver) {
      if (member(root, "experiences")) return { ok: false, error: "psylog" };
      if (member(root, "doseEntries")) return { ok: false, error: "legacy" };
      return { ok: false, error: "notpiru" };
    }
    if (ver.t !== "n" || !Number.isInteger(ver.v)) return { ok: false, error: "notpiru" };
    var sv = get(root, "sessions"), ov = get(root, "orphanDoses");
    if ((sv && sv.t !== "a" && sv.t !== "z") || (ov && ov.t !== "a" && ov.t !== "z")) return { ok: false, error: "notpiru" };
    var model = buildModel(text, root);
    model.version = ver.v;
    model.newer = ver.v > SUPPORTED_VERSION;
    model.appVersion = getStr(root, "appVersion");
    if (model.doses.length === 0) return { ok: false, error: "noentries", model: model };
    return { ok: true, model: model };
  }

  function buildModel(text, root) {
    var doses = [];
    function addDose(node) {
      var sub = getStr(node, "substance");
      if (sub === null) return;
      doses.push({
        node: node, sub: sub, ts: getNum(node, "timestamp"), amount: getNum(node, "amount"),
        unit: getStr(node, "unit") || "", route: getStr(node, "route") || "",
        uid: getStr(node, "substanceUID"), snap: getStr(node, "displayNameSnapshot"),
        hasFacet: DOSE_FACETS.some(function (f) { var v = get(node, f); return v && v.t !== "z"; }),
        plain: !["isomer", "releaseForm", "productName"].some(function (f) { var v = get(node, f); return v && v.t !== "z"; }),
        inv: getStr(node, "inventoryItemID")
      });
    }
    arr(root, "sessions").forEach(function (s) { arr(s, "doses").forEach(addDose); });
    arr(root, "orphanDoses").forEach(addDose);

    var records = {
      favorites: arr(root, "favorites"),
      quickLog: arr(root, "quickLogDoses"),
      units: firstArr(root, ["customUnits", "customUnitPresets"]),
      drinks: firstArr(root, ["drinkPresets", "customDrinkPresets"]),
      daily: arr(root, "dailyDoseItems"),
      occurrences: arr(root, "routineOccurrences"),
      inventory: arr(root, "inventory"),
      colors: arr(root, "substanceColors")
    };
    var customs = arr(root, "customSubstances").map(function (c) {
      return { name: getStr(c, "name"), displayName: getStr(c, "displayName") };
    }).filter(function (c) { return c.name; });

    var counts = new Map();
    doses.forEach(function (d) { counts.set(d.sub, (counts.get(d.sub) || 0) + 1); });
    var customNames = new Set(customs.map(function (c) { return c.name; }));
    var substances = Array.from(counts, function (e) {
      var c = customs.find(function (x) { return x.name === e[0]; });
      return { name: e[0], count: e[1], custom: customNames.has(e[0]), label: c && c.displayName && c.displayName !== e[0] ? c.displayName : null };
    }).sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });

    // Every substance name in the backup, for the "to" list and typed-name matching.
    var other = new Set();
    customs.forEach(function (c) { other.add(c.name); });
    ["favorites", "quickLog", "daily", "occurrences", "inventory", "colors"].forEach(function (k) {
      records[k].forEach(function (r) { var s = getStr(r, "substance"); if (s) other.add(s); });
    });
    ["units", "drinks"].forEach(function (k) {
      records[k].forEach(function (r) { var s = getStr(r, "substanceName"); if (s) other.add(s); });
    });
    counts.forEach(function (_, k) { other.delete(k); });

    // Alternative spellings that point at a stored name.
    var aliases = new Map();
    function alias(spelling, target) { if (spelling && target && !aliases.has(fold(spelling))) aliases.set(fold(spelling), target); }
    substances.forEach(function (s) { alias(s.name, s.name); });
    other.forEach(function (s) { alias(s, s); });
    customs.forEach(function (c) { alias(c.displayName, c.name); });
    doses.forEach(function (d) { alias(d.snap, d.sub); });

    return {
      text: text, root: root, doses: doses, records: records, customs: customs, customNames: customNames,
      substances: substances, otherNames: Array.from(other).sort(function (a, b) { return a.localeCompare(b); }), aliases: aliases
    };
  }

  function allNames(model) { return model.substances.map(function (s) { return s.name; }).concat(model.otherNames); }

  // Matches a typed name against the backup. exact: same string; matched: other spelling found; none: unknown.
  function resolveTyped(model, typed) {
    var t = String(typed || "").trim();
    if (!t) return { name: "", status: "empty" };
    if (allNames(model).indexOf(t) >= 0) return { name: t, status: "exact" };
    var hit = model.aliases.get(fold(t));
    if (hit) return { name: hit, status: "matched", typed: t };
    return { name: t, status: "none" };
  }

  function mostCommon(values) {
    var c = new Map(), best = null, bestN = 0;
    values.forEach(function (v) { if (v) { var k = (c.get(v) || 0) + 1; c.set(v, k); if (k > bestN) { best = v; bestN = k; } } });
    return best;
  }

  function targetIdentity(model, to) {
    var plain = model.doses.filter(function (d) { return d.sub === to && d.uid && d.snap && d.plain; });
    var uid = mostCommon(plain.map(function (d) { return d.uid; }));
    var snap = uid ? mostCommon(plain.filter(function (d) { return d.uid === uid; }).map(function (d) { return d.snap; })) : null;
    var anyUID = uid || mostCommon(
      model.doses.filter(function (d) { return d.sub === to; }).map(function (d) { return d.uid; })
        .concat(["favorites", "quickLog", "daily", "occurrences"].reduce(function (acc, k) {
          return acc.concat(model.records[k].filter(function (r) { return getStr(r, "substance") === to; }).map(function (r) { return getStr(r, "substanceUID"); }));
        }, []))
    );
    return { uid: uid && snap ? uid : null, snap: uid && snap ? snap : null, anyUID: anyUID };
  }

  function dedupKey(sub, d) { return sub.toLowerCase() + "|" + d.ts + "|" + d.amount + "|" + d.unit.toLowerCase() + "|" + d.route; }

  // What would change. options: { shortcuts, meds, stock } (all default false: entries only).
  function plan(model, from, to, options) {
    options = options || {};
    var id = targetIdentity(model, to);
    var moved = model.doses.filter(function (d) { return d.sub === from; });
    var stay = new Set(model.doses.filter(function (d) { return d.sub !== from; }).map(function (d) { return dedupKey(d.sub, d); }));
    var p = {
      from: from, to: to, identity: id, doses: moved,
      facetCount: moved.filter(function (d) { return d.hasFacet; }).length,
      duplicates: moved.filter(function (d) { return stay.has(dedupKey(to, d)); }).length,
      fromIsCustom: model.customNames.has(from), toIsCustom: model.customNames.has(to),
      extra: { favorites: [], quickLog: [], units: [], drinks: [], daily: [], occurrences: [], inventory: [] },
      skipped: { favorites: 0, daily: 0, inventory: 0 }
    };
    var R = model.records;
    function bySub(list, key, name) { return list.filter(function (r) { return getStr(r, key) === name; }); }
    if (options.shortcuts) {
      var toFav = bySub(R.favorites, "substance", to).length > 0;
      bySub(R.favorites, "substance", from).forEach(function (r) { if (toFav) p.skipped.favorites++; else p.extra.favorites.push(r); });
      p.extra.quickLog = bySub(R.quickLog, "substance", from);
      p.extra.units = bySub(R.units, "substanceName", from);
      p.extra.drinks = bySub(R.drinks, "substanceName", from);
    }
    if (options.meds) {
      var toDaily = bySub(R.daily, "substance", to).length > 0;
      bySub(R.daily, "substance", from).forEach(function (r) { if (toDaily) p.skipped.daily++; else p.extra.daily.push(r); });
      if (!toDaily) p.extra.occurrences = bySub(R.occurrences, "substance", from);
    }
    if (options.stock) {
      var toAuto = bySub(R.inventory, "substance", to).some(function (r) { var v = get(r, "isAutomaticSource"); return v && v.v === true; });
      bySub(R.inventory, "substance", from).forEach(function (r) {
        var v = get(r, "isAutomaticSource");
        if (toAuto && v && v.v === true) p.skipped.inventory++; else p.extra.inventory.push(r);
      });
    }
    return p;
  }

  function counts(model, from) {
    var R = model.records;
    function n(list, key) { return list.filter(function (r) { return getStr(r, key) === from; }).length; }
    return {
      entries: model.doses.filter(function (d) { return d.sub === from; }).length,
      shortcuts: n(R.favorites, "substance") + n(R.quickLog, "substance") + n(R.units, "substanceName") + n(R.drinks, "substanceName"),
      meds: n(R.daily, "substance") + n(R.occurrences, "substance"),
      stock: n(R.inventory, "substance")
    };
  }

  // Builds the minimal text edits for one object: replace values, insert after `afterKey`, remove keys.
  function objectEdits(text, obj, set, insert, remove, edits) {
    var removeSet = new Set(remove.filter(function (k) { return member(obj, k); }));
    Object.keys(set).forEach(function (k) {
      var mm = member(obj, k);
      if (mm) edits.push({ s: mm.v.s, e: mm.v.e, text: JSON.stringify(set[k]) });
    });
    var ins = Object.keys(insert).filter(function (k) { return !member(obj, k); });
    if (ins.length) {
      var anchorIdx = obj.m.indexOf(member(obj, insert.__after || "substance"));
      if (anchorIdx < 0) anchorIdx = obj.m.length - 1;
      var anchor = obj.m[anchorIdx];
      var sep, colon;

    if (skipped.length) box.appendChild(msg("warn", t.skipped(target.name) + skipped.join(", ") + "."));
    if (p.facetCount) box.appendChild(msg("warn", t.facets(p.facetCount, from)));
    if (p.duplicates) box.appendChild(msg("warn", t.dups(p.duplicates, target.name)));
    if (target.status === "none") box.appendChild(msg("warn", t.typedWarnShort));
    if (p.fromIsCustom) box.appendChild(el("p", { class: "muted", style: "margin-top:12px" }, t.fromCustom(from)));
    box.appendChild(el("p", { class: "muted", style: "margin-top:12px" }, t.unchanged));
    $("download").disabled = p.doses.length === 0;
    if (state.done) $("download-status").appendChild(msg("ok", t.done));
  }

  function renderAll(keep) {
    renderLoad();
    var has = !!state.model && !state.error;
    $("choose").classList.toggle("hidden", !has);
    if (!has) { $("preview-card").classList.add("hidden"); $("download-card").classList.add("hidden"); return; }
    fillFrom(keep); fillTo(keep); renderTyped(); renderOptions(); renderPreview();
  }

  $("lang-fr").addEventListener("click", function () { setLang("fr"); });
  $("lang-en").addEventListener("click", function () { setLang("en"); });
  $("from").addEventListener("change", function () { state.done = false; fillTo(true); renderTyped(); renderOptions(); renderPreview(); });
  $("to").addEventListener("change", function () { state.done = false; renderTyped(); renderPreview(); if ($("to").value === TYPE) $("typed").focus(); });
  $("typed").addEventListener("input", function () { state.done = false; renderTyped(); renderPreview(); });

  $("file").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) return;
    state = { model: null, fileName: f.name, error: null, done: false };
    var reader = new FileReader();
    reader.onload = function () {
      var res = PiruFix.analyze(new Uint8Array(reader.result), f.name);
      if (res.ok) state.model = res.model; else state.error = res.error;
      $("typed").value = "";
      renderAll(false);
      $("how").open = false;
    };
    reader.onerror = function () { state.error = "read"; renderAll(false); };
    reader.readAsArrayBuffer(f);
    ev.target.value = "";
  });

  $("download").addEventListener("click", function () {
    if (!currentPlan || !state.model) return;
    var out = PiruFix.apply(state.model, currentPlan);
    var blob = new Blob([out], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a", { href: url, download: "piru-backup-corrected.json" });
    a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    state.done = true;
    var box = $("download-status"); box.textContent = ""; box.appendChild(msg("ok", T[lang].done));
  });

  setLang(lang);
})();
</script>
</body>
</html>
