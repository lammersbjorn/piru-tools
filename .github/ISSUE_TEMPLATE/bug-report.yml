name: Bug report
description: A tool did something wrong, or the page doesn't work.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never attach a real backup, export or screenshot of your journal. If a tool changed or lost data, report it privately instead: see [SECURITY.md](https://github.com/lammersbjorn/piru-tools/blob/main/SECURITY.md).
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Tool list (index)
        - Inspect a backup
        - Move entries to another substance
        - Remove duplicates
        - Fix units
        - Shift entries in time
        - Split out entries
        - Make a prompt to contribute
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step, what you expected and what happened. Quote any message exactly.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Made-up example
      description: If the problem depends on the backup's content, describe it or paste a small made-up backup that shows it. Never paste a real one.
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Safari on iPhone, iOS 26.1
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Page language
      options:
        - English
        - Français
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no real backup, journal entries or screenshots of them.
          required: true
