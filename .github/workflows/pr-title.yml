name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title follows Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Squash merges use the PR title as the commit header.
      - name: Check title with the commit-msg hook
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The hook lets Git-generated merge, revert and autosquash headers
          # through; a PR title is never one of those.
          case "$TITLE" in
            "Merge "* | "Revert \""* | "fixup! "* | "squash! "* | "amend! "*)
              echo "PR title must be type(scope): subject, not a Git-generated header." >&2
              exit 1 ;;
          esac
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg "$RUNNER_TEMP/title"
